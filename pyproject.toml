[project]
name = "todo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Michael Reilly", email = "mikeyreilly@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.0",
]

[project.scripts]
todo = "todo:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "poethepoet>=0.48.0",
    "pytest>=8",
]

[tool.poe.tasks]
migrations	= "npx dbmate up"
server		= "uv run fastapi dev src/todo/main.py"

[tool.poe.tasks.dev-start]
sequence	= ["migrations", "server"]
